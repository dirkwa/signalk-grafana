language: en-US

reviews:
  profile: assertive
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    # Skip mechanical PRs that don't benefit from review.
    # `chore(release):` PRs are version-bump-only; the substantive change
    # was already reviewed on its own PR. Dep-bump PRs come from
    # automation that has its own contract with the registry. WIP and
    # explicit skip markers are author opt-outs.
    ignore_title_keywords:
      - "chore(release):"
      - "chore(deps):"
      - "chore(deps-dev):"
      - "[skip review]"
      - "WIP"
    ignore_usernames:
      - "release-please[bot]"
      - "renovate[bot]"
      - "dependabot[bot]"
      - "github-actions[bot]"

  # `dist/` is the TypeScript + webpack build output (tsc emits the
  # server-side code, webpack emits the config-panel bundle). Tracked
  # because the App Store install path needs it, but never authored by
  # hand — the source of truth is `src/`. Lockfiles and minified files
  # are also off-limits.
  path_filters:
    - "!dist/**"
    - "!**/node_modules/**"
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/*.min.js"
    - "!**/*.min.css"

  high_level_summary_instructions: |
    Write summaries in present tense. Describe what the code does, not
    what it did. Skip filler like "This PR" — go straight to the change.

  path_instructions:
    - path: "**/*"
      instructions: |
        ## Project at a glance
        `signalk-grafana` is a Signal K server plugin that lifecycles a
        Grafana container and provisions two datasources into it: the
        QuestDB time-series datasource (for live and historical data
        from signalk-questdb) and the `tkurki-signalk-datasource` (for
        ad-hoc Explore + historical queries straight from the SK
        server). It uses signalk-container's cross-plugin API on
        `globalThis.__signalk_containerManager` to manage the Grafana
        container, and integrates with signalk-backup via
        `src/full-export.ts` for dashboard + datasource backup/restore.

        ## One logical change per PR
        Hard rule. A bundled PR that "while I was in here, I also fixed
        X" is not acceptable, even for small X. The publish workflow
        generates GitHub Release notes from PR titles on `v*` tag push —
        a bundled PR produces a single release-note line that hides the
        smaller change. If a PR would produce two distinct release-note
        lines, it should be two PRs.

        ## Conventional commit PR title
        The PR title must follow Angular conventional commit format:
        `<type>(<scope>): <subject>`. Accepted types: feat, fix, docs,
        style, refactor, test, chore, perf, ci. Subject: imperative
        mood ("add" not "added"), no trailing period, under 70
        characters. The PR title becomes the line in the auto-generated
        GitHub Release notes.

        ## Branch naming
        No `/` in branch names — Signal K maintainers' convention. Use
        hyphens: `fix-token-flow`, not `fix/token-flow`.

        ## Version numbers are release-PR-only
        Flag any non-release PR that changes the version in
        `package.json`. Version bumps happen in their own
        `chore(release): X.Y.Z` PR, never bundled with a feature or
        fix.

        ## No CHANGELOG.md
        This repo has no CHANGELOG.md; release notes are generated by
        `publish.yml` from PR titles on tag push. Flag any PR that
        adds a CHANGELOG.md — there is no place to keep it in sync.

        ## Echo comments
        Flag any comment that merely restates what the code already
        says. Examples:
        - `// Sets the value` above an obvious setter
        - `// Loop through items` above a `for` loop over items
        - `// returns null` next to `return null` in an error branch
        Replace with comments explaining *why*, or delete.

        ## No multi-line comment blocks or docstrings
        Per project convention (AGENTS.md "Conventions" section), don't
        write `/** ... */` blocks or other multi-line comment groups.
        A short single-line comment for a non-obvious WHY is fine;
        everything else is noise. Flag any new multi-line comment
        block in source files.

        ## Leftover crumbs from intermediate commits
        Flag references to things that existed in earlier commits of
        this PR but are no longer present: removed variables, renamed
        functions, deleted files, superseded approaches.

        ## Documentation drift risk
        Flag any .md file that contains detailed implementation steps,
        specific API call sequences, code snippets, or configuration
        values that are likely to fall out of sync. Documentation
        should describe architecture conceptually — not step-by-step
        instructions that duplicate or shadow the code itself.
        AGENTS.md is the intentional exception: it documents
        non-obvious project conventions that ARE allowed to be
        prescriptive.

        ## Unchecked items / speculative test plans
        Flag any PR description (or .md file) with a checklist
        containing unchecked items: either the work is incomplete, or
        the checklist should be removed before merge. Flag any
        "Tested" section that lists manual tests as intentions rather
        than things actually run.

        ## AI attribution footers
        Flag any commit message, PR description, or code comment
        containing "Co-Authored-By: Claude", "Generated with Claude
        Code", "🤖 Generated with", or similar AI-attribution. These
        do not belong in the project history.

        ## Implementation status in product documentation
        Flag implementation-progress narratives in README.md,
        AGENTS.md, or other reference docs (e.g. "Step 3: implement
        X", "TODO: add Y", "currently implemented as Z"). Architecture
        decisions and design rationale are fine; build-progress
        narratives are not.

        ## Scope
        Focus on files changed since master. Think carefully about how
        changes interact with existing code, tests, and documentation —
        not just the diff in isolation.

    - path: "src/**/*.ts"
      instructions: |
        ## TypeScript strict, no `any` escapes
        tsconfig is strict. Avoid `any`. The allowed exception is the
        cast on `(globalThis as any).__signalk_containerManager` — the
        consumer side cannot take a compile-time dependency on
        signalk-container. Don't introduce other `as any` casts to
        silence the type checker; fix the type instead.

        ## Cross-plugin globalThis API needs undefined-handling
        signalk-container exposes its API on
        `globalThis.__signalk_containerManager`, not on the `app`
        object (Signal K passes each plugin a shallow copy of `app`).
        Any new call site that reads the global must handle the
        `undefined` case (signalk-container may not have finished its
        own `start()` yet on cold boot, or the user disabled it).

        ## Signal K device-token flow invariants
        `src/signalk-token.ts` + `ensureSignalkToken()` in
        `src/index.ts` drive the standard SK device-access-request
        flow with `clientId = signalk-grafana` and `permissions =
        "readwrite"`. Flag PRs that:
        - drop the `readwrite` scope without rationale (SK admin UI
          cannot widen permissions post-approval, only revoke +
          re-request; readwrite reserves scope for future
          Grafana-alerting → SK-notification paths)
        - change the `clientId`
        - cache the token anywhere other than
          `${app.getDataDirPath()}/signalk-token` (mode 0600)
        - bind-mount the token file into the grafana container.
          Grafana reads its datasource credentials from its own
          secret store (provisioned via `secureJsonData.token` in the
          YAML, picked up server-side by the datasource HTTP proxy
          route). Bind-mounting the token would leak it into the
          container filesystem and would still not reach the
          datasource. mayara learned this lesson the hard way; don't
          repeat it here.
        - skip the `tokenPollerCancelled` cancellation flag in
          `start()` / `stop()` — the access-request poller will
          outlive the plugin otherwise
        - switch the recreate-on-approval path from explicit
          `containers.remove(...) + ensureRunning(...)` to a plain
          `ensureRunning(...)` (signalk-container's drift detection
          diffs the bind-mount _path_, not the file contents; Grafana
          only reads provisioning at boot, so the explicit recreate
          is the only way the new token reaches the running grafana
          process)
        - switch the `requestSignalkToken !== false` check to `===
          true` (Signal K does not inject schema defaults at runtime,
          so the field is `undefined` on first install with `{}`
          config; the `!== false` form is deliberate)

        ## Provisioning YAML invariants
        `generateProvisioning()` in `src/provisioning.ts` writes
        `dist/provisioning/datasources/{signalk,questdb}.yaml`. Flag
        PRs that:
        - write `secureJsonData.token` from any source other than
          `readCachedToken()` or a freshly-approved `awaitApproval()`
          return value
        - emit a token into the YAML without first passing it through
          the JWT-shape regex guard (protects against YAML injection
          if a future caller threads user input through)
        - omit `useAuth: false` from the no-token branch (the
          tkurki-signalk-datasource routes on `useAuth` to pick the
          authed vs no-auth HTTP proxy route — leaving it out
          defaults the datasource to its UI-time setting which is
          undefined for fresh installs)

        ## Container config recreate-on-change
        `src/index.ts` maintains a `<dataDir>.container-hash` file
        and recreates the grafana container when `{ tag, ports, env,
        networkMode }` changes. Adding a new env var or port mapping
        forces a recreate on next plugin start (which is normally
        what you want — but it does mean existing users see container
        churn whenever you touch this code). Flag PRs that bypass
        the hash check.

        ## `podman unshare chmod` workaround scope
        The grafana image runs as uid 472. On rootless podman with
        bind-mounted `grafana-data`, the entrypoint's `chown -R
        grafana:grafana` fails unless the host-side dir is writable
        across UID namespaces. The plugin runs `podman unshare chmod
        -R a+rwX ${dataDir}/grafana-data` to fix this — but only when
        rootless podman AND SK is NOT containerized (the in-container
        SK case bundles podman-via-remote-socket, which doesn't
        support `unshare`). Flag PRs that:
        - run `podman unshare` on docker (the binary is not present)
        - run `podman unshare` when SK is containerized (will write a
          "cannot use command 'podman unshare' with the remote podman
          client" line to stderr before failing)
        - silently swallow stderr from this call (the `stdio: 'ignore'`
          is deliberate — if you want to surface failures, surface
          them with context, not as a raw "could not fix permissions")

    - path: "src/test/**/*.ts"
      instructions: |
        ## node:test only
        Tests run via `node --test` against `dist/test/**/*.test.js`.
        Flag any test file that introduces a different runner (vitest,
        jest, mocha). Tests are written in TS under `src/test/` and
        run from the tsc output under `dist/test/`.

        ## Tests run against dist, not src
        Editing `src/test/foo.test.ts` and running `npm test` without
        a rebuild runs the *previous* compiled version from `dist/`.
        Reviewers should flag PRs whose test changes don't include a
        `npm run build:all` mention in the description, or where the
        test assertions don't match the source changes in the same PR.

        ## No real HTTP against 127.0.0.1
        Token-flow tests in `signalk-token.test.ts` stub `globalThis.
        fetch` per-test with a hand-rolled `stubFetch` helper (no
        mock library — node:test doesn't have one and the surface is
        small enough). Flag tests that issue real HTTP against
        `127.0.0.1` / `localhost`, or that don't restore `originalFetch`
        in `afterEach`.

        ## Provisioning tests use tempdir + JWT-shape fixture
        `provisioning.test.ts` writes to `mkdtempSync` directories and
        cleans up in `afterEach`. Token-injection tests use a
        well-formed JWT-shape string (3 base64url segments separated
        by dots). Tests that pass random strings as "tokens" will hit
        the JWT-shape guard and fail with a confusing message; use the
        existing fixture pattern.

    - path: ".github/workflows/**"
      instructions: |
        ## No NPM_TOKEN / NODE_AUTH_TOKEN in publish.yml
        Trusted publishing via OIDC is configured on npm; no
        `NPM_TOKEN` secret exists or is needed. Flag any PR that adds
        `NODE_AUTH_TOKEN`, `NPM_TOKEN`, or `secrets.NPM_TOKEN` to
        `publish.yml`.

        ## Publish fires on v* tag
        `publish.yml` fires on `v*` tag push. It creates a GitHub
        Release with auto-generated notes (one line per PR since the
        previous tag) then `npm publish`es via OIDC trusted
        publishing. Flag any PR that changes the trigger or breaks
        the release-notes generation.

    - path: "src/config/schema.ts"
      instructions: |
        ## Defaults not auto-injected — runtime reads must tolerate undefined
        Signal K does NOT inject schema `default` annotations into the
        runtime config passed to `plugin.start()`. They only seed the
        admin-UI form. When the plugin is auto-enabled (or enabled
        without saving the form), `start()` is called with `{}`. Any
        new field with a `default` annotation must be read at the call
        site in a way that tolerates `undefined` — either via `??` /
        `||` defaults, or via the `!== false` / `=== true` pattern.
        Flag any new field that's read without an undefined-handling
        path at the consumer.

    - path: "package.json"
      instructions: |
        ## Node engines floor: 3-place sync
        When bumping the Node engines floor, the following MUST all
        be updated in the same PR:
        1. `engines.node` in `package.json`
        2. `@types/node` in `package.json` devDependencies (matching
           major)
        3. README "Requirements" line that documents the floor
        Flag any engines bump that touches fewer than these three
        places.

        ## Peer dependency boundaries
        signalk-container ≥1.6.0 (or whatever the current floor is)
        is the cross-plugin contract. Flag any PR that bumps the
        floor without updating the consumer-side ContainerManagerApi
        interface declaration in `src/index.ts` to match the methods
        it actually uses from the new floor.
